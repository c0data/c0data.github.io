<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing — C0DATA</title>
<style>
  :root { --bg: #0d1117; --bg-raised: #161b22; --border: #30363d; --text: #c9d1d9; --text-dim: #8b949e; --text-bright: #e6edf3; --accent: #e3a93b;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace; --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav { border-bottom: 1px solid var(--border); background: var(--bg-raised); font-family: var(--mono); }
  nav .container { max-width: 46rem; margin: 0 auto; padding: 0.9rem 1.25rem; display: flex; justify-content: space-between; align-items: center; }
  nav .logo { font-weight: 700; letter-spacing: 0.05em; color: var(--text-bright); } nav .logo span { color: var(--accent); }
  nav ul { list-style: none; display: flex; gap: 1.25rem; font-size: 0.85rem; } nav ul a { color: var(--text-dim); }
  main { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { color: var(--text-bright); font-size: 1.6rem; margin-bottom: 1.5rem; }
  .post { padding: 1rem 0; border-bottom: 1px solid var(--border); }
  .post a { font-size: 1.15rem; } .post .meta { color: var(--text-dim); font-family: var(--mono); font-size: 0.85rem; }
</style>
</head>
<body>
<nav><div class="container"><a class="logo" href="../"><span>C0</span>DATA</a><ul><li><a href="https://github.com/c0data/c0-spec">Spec</a></li><li><a href="https://github.com/c0data">GitHub</a></li></ul></div></nav>
<main>
<h1>Writing</h1>
<div class="post">
  <a href="the-message-format-in-ascii/">The message format that was already in ASCII</a>
  <div class="meta">Thomas Sawyer · 8 November 2026</div>
</div>
</main>
</body>
</html>
